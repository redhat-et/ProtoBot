---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Enable the hooks for this repo
# > pip install --user --upgrade uv
# > uv tool install pre-commit
# > pre-commit install

# yamllint disable rule:line-length

# Completely exclude certain files from checks
# exclude: |
#   (?x)^(
#     vendor/.**|
#     dir2/.*
#   )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # pragma: allowlist secret; v6.0.0
    hooks:
      - id: check-added-large-files  # Prevents giant files from being committed
      - id: check-docstring-first    # Prevent code before docstring
      - id: check-json               # Check that JSON files are valid
      - id: check-merge-conflict     # Check merge conflict strings
      - id: check-symlinks           # Ensure symlinks have a valid target
      - id: check-toml               # Ensure toml files are valid
      - id: check-xml                # Check that XML files are valid
      - id: debug-statements         # debugger imports and breakpoint() calls
      - id: end-of-file-fixer        # File is empty or ends with one newline
      - id: fix-byte-order-marker    # Forbid utf-8 byte order marker
      - id: trailing-whitespace      # Trims trailing whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # pragma: allowlist secret; v1.10.0
    hooks:
      # Forbid UTF-8 replacement character
      - id: text-unicode-replacement-char

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # pragma: allowlist secret; v1.38.0
    hooks:
      # Lint yaml files
      - id: yamllint
        args: ["--strict", "-c", ".github/yamllint-config.yaml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # pragma: allowlist secret; v0.16.4
    hooks:
      # Note: lint/fix before format
      - id: ruff-check
      # args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: b84c4a0a90bd58c7d82ae8f0d4d5e77b1ddd3ce6  # pragma: allowlist secret; 0.12.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # pragma: allowlist secret; v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".github/markdownlint-cli2.yaml"]
        exclude: |
          (?x)^(
                .github/pull_request_template\.md |
                .agents/skills/
            )$

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # pragma: allowlist secret; v2.15.1
    hooks:
      # Lint Dockerfiles
      - id: hadolint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 4de1378e4cd853bfc2b111b05fff35e2dbf809a3  # pragma: allowlist secret; v0.9.0.6
    hooks:
      - id: shellcheck

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # pragma: allowlist secret; v1.5.0
    hooks:
      # Prevent secrets from being committed
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://gitlab.com/bmares/check-json5
    rev: 82381b1133603e4ff6eb3d866ec4501d121b669b  # pragma: allowlist secret; v1.0.1
    hooks:
      # Check that JSON files are valid JSON5
      - id: check-json5

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # pragma: allowlist secret; v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 66aa87b54ea1eb8d84f613942b4233db5f6ac749  # pragma: allowlist secret; 44.52.1
    hooks:
      - id: renovate-config-validator
