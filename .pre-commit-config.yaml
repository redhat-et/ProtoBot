---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Enable the hooks for this repo
# > pip install --user --upgrade uv
# > uv tool install pre-commit
# > pre-commit install

# yamllint disable rule:line-length

# Note on validator/vendor/:
# validator/vendor/ holds go mod vendor's copy of validator's module
# dependencies (gopkg.in/yaml.v3 as of this writing) so the always-run
# spec-validator hook (see its entry below) can build offline without a
# populated GOMODCACHE. CI's "Check formatting" step
# (.github/workflows/ci-workflow.yaml:244) runs `gofmt -l validator`,
# which recurses into vendor/. Run `gofmt -w validator/vendor/gopkg.in/yaml.v3`
# after `go mod vendor` to keep vendored sources formatted. Formatting
# fixers below exclude validator/vendor/ individually, keeping secret
# scans and size checks unfiltered.

# Completely exclude certain files from checks
# exclude: |
#   (?x)^(
#     vendor/.**|
#     dir2/.*
#   )$

repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad  # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".github/markdownlint-cli2.yaml"]
        exclude: |
          (?x)^(
                .github/pull_request_template\.md |
                .agents/skills/ |
                validator/vendor/.*
            )$

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      # Lint Dockerfiles
      - id: hadolint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6f9f6fb27042eeb2c12163c94cf22289e9710eda  # frozen: 44.239.1
    hooks:
      - id: renovate-config-validator

  # Offline local checks so sandboxed agents catch formatting, vet,
  # and skillsaw baseline-ceiling ratchet errors without network hook
  # repositories.
  #
  # The hooks below pin a PyPI package via `additional_dependencies`
  # instead of cloning a hook repository from GitHub/GitLab, because the
  # sandboxed coding-agent profile allows pypi.org/files.pythonhosted.org
  # but not git/github.com clones (see issue #550). `language: python`
  # makes pre-commit build a per-hook virtualenv and `pip install` the
  # pinned package; no image change or network to a VCS host is needed.
  # First use in a new environment still requires pypi.org and
  # files.pythonhosted.org for `pip install`, so an offline sandbox must
  # warm PRE_COMMIT_HOME with `scripts/pre_commit_cache.py` first.
  - repo: local
    hooks:
      # General file and hygiene checks.
      # Mirrors https://github.com/pre-commit/pre-commit-hooks.
      - id: check-added-large-files
        name: check-added-large-files
        description: Prevents giant files from being committed
        entry: check-added-large-files
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        stages: [pre-commit, pre-push, manual]
      - id: check-docstring-first
        name: check-docstring-first
        description: Prevent code before docstring
        entry: check-docstring-first
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [python]
      - id: check-json
        name: check-json
        description: Check that JSON files are valid
        entry: check-json
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [json]
      - id: check-merge-conflict
        name: check-merge-conflict
        description: Check merge conflict strings
        entry: check-merge-conflict
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
      - id: check-symlinks
        name: check-symlinks
        description: Ensure symlinks have a valid target
        entry: check-symlinks
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [symlink]
      - id: check-toml
        name: check-toml
        description: Ensure toml files are valid
        entry: check-toml
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [toml]
      - id: check-xml
        name: check-xml
        description: Check that XML files are valid
        entry: check-xml
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [xml]
      - id: debug-statements
        name: debug-statements
        description: debugger imports and breakpoint() calls
        entry: debug-statement-hook
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [python]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        description: File is empty or ends with one newline
        entry: end-of-file-fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: ^validator/vendor/
      - id: fix-byte-order-marker
        name: fix-byte-order-marker
        description: Forbid utf-8 byte order marker
        entry: fix-byte-order-marker
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
        exclude: ^validator/vendor/
      - id: trailing-whitespace
        name: trailing-whitespace
        description: Trims trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
        stages: [pre-commit, pre-push, manual]
        args: [--markdown-linebreak-ext=md]
        exclude: ^validator/vendor/
      # Forbid UTF-8 replacement character.
      # Mirrors https://github.com/pre-commit/pygrep-hooks's
      # text-unicode-replacement-char hook. `pygrep` is built into
      # pre-commit, so this needs no additional_dependencies.
      - id: text-unicode-replacement-char
        name: text-unicode-replacement-char
        entry: "\uFFFD"
        language: pygrep
        types: [text]
        exclude: ^validator/vendor/
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        additional_dependencies: ["yamllint==1.38.0"]
        types: [file, yaml]
        args: ["--strict", "-c", ".github/yamllint-config.yaml"]
        exclude: |
          (?x)^\.fullsend/config\.yaml$
      # Note: lint/fix before format
      - id: ruff-check
        name: ruff-check
        description: "Run 'ruff check' for extremely fast Python linting"
        entry: ruff check --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.5"]
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: ^validator/vendor/
      # args: [ --fix ]
      - id: ruff-format
        name: ruff-format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.5"]
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        exclude: ^validator/vendor/
      - id: skillsaw
        name: skillsaw
        description: Lint agentic contextual building blocks (CLAUDE.md, skills, plugins, hooks, ...)
        entry: skillsaw lint
        language: python
        additional_dependencies: ["skillsaw==0.23.0"]
        pass_filenames: false
        files: .
      - id: shellcheck
        name: shellcheck
        description: Test shell scripts with shellcheck
        entry: shellcheck
        language: python
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
        types: [shell]
        require_serial: true  # shellcheck can detect sourcing this way
      # Prevent secrets from being committed
      - id: detect-secrets
        name: Detect secrets
        entry: detect-secrets-hook
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        args: ["--baseline", ".secrets.baseline"]
        files: .*
        exclude: |
          (?x)^(
                .fullsend/config\.yaml |
                \.skillsaw-baseline\.json |
                \.pre-commit-config\.yaml |
                \.protobot/change-sets/.*
            )$
      # YAML normalization quotes scalar values before line filters run.
      - id: detect-secrets
        name: detect-secrets-change-set-records
        entry: detect-secrets-hook
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-lines"
          - '^(base_commit|impact_assessment_base_commit): "[0-9a-fA-F]{40}"$'
        files: ^\.protobot/change-sets/
      # Check that JSON files are valid JSON5. Uses
      # https://github.com/simonvanlierde/check-json5 (tag v1.4.1), a
      # maintained PyPI-published fork of
      # https://gitlab.com/bmares/check-json5 (which has no PyPI package of
      # its own).
      - id: check-json5
        name: check json5
        description: checks json files for syntax parsable as json5 (with comments).
        entry: check-json5
        language: python
        additional_dependencies: ["json5==0.17.3", "check-json5==3.5.0"]
        types_or: [json, json5]
      - id: zizmor
        name: zizmor
        description: "Find security issues in GitHub Actions CI/CD setups"
        language: python
        additional_dependencies: ["zizmor==1.32.0"]
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true
        entry: zizmor
        args: ["--config", ".zizmor.yml"]
      - id: gofmt
        name: gofmt
        entry: python3 scripts/check_gofmt.py
        language: system
        files: \.go$
        exclude: ^validator/vendor/
      - id: go-vet
        name: go-vet
        entry: python3 scripts/check_govet.py
        language: system
        files: \.go$
        exclude: ^validator/vendor/
      - id: check-portable-null-device
        name: check-portable-null-device
        entry: python3 scripts/check_portable_null_device.py
        language: system
        files: \.go$
      - id: test-check-portable-null-device
        name: test-check-portable-null-device
        entry: python3 scripts/test_check_portable_null_device.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_portable_null_device|test_check_portable_null_device)\.py$
      - id: eval-corpus-schema
        name: eval-corpus-schema
        entry: python3 eval/corpus/validate.py
        language: system
        pass_filenames: false
        files: ^(eval/corpus/.+|docs/architecture/evaluation-corpus\.md)$
      - id: harness-integrity
        name: harness-integrity
        entry: python3 scripts/check_harness_integrity.py --online-if-ci
        language: system
        pass_filenames: false
        files: ^\.fullsend/harness/[^/]+\.ya?ml$
      - id: test-harness-integrity
        name: test-harness-integrity
        entry: python3 scripts/test_check_harness_integrity.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_harness_integrity|test_check_harness_integrity)\.py$
      - id: baseline-ratchet
        name: baseline-ratchet
        entry: python scripts/check_baseline_ratchet.py
        language: python
        # The checker imports PyYAML to verify the AGENTS.md warn limit.
        additional_dependencies:
          - pyyaml==6.0.3
        pass_filenames: false
        # Pre-commit omits deleted files from the selection. The checker
        # rejects deleting the baseline while tracked ceiling files remain.
        always_run: true
      - id: test-baseline-ratchet
        name: test-baseline-ratchet
        entry: python scripts/test_check_baseline_ratchet.py
        language: python
        # The tests import PyYAML through the checker.
        additional_dependencies:
          - pyyaml==6.0.3
        pass_filenames: false
        files: ^scripts/(check_baseline_ratchet|test_check_baseline_ratchet)\.py$
      - id: test-lint-wrapper
        name: test-lint-wrapper
        entry: python3 scripts/test_lint.py
        language: system
        pass_filenames: false
        files: ^(scripts/(lint|test_lint)\.py|\.github/workflows/ci-workflow\.yaml)$
      - id: test-pre-commit-cache
        name: test-pre-commit-cache
        entry: python3 scripts/test_pre_commit_cache.py
        language: system
        pass_filenames: false
        files: ^(scripts/(pre_commit_cache|test_pre_commit_cache)\.py|\.fullsend/harness/[^/]+\.ya?ml)$
      - id: adr-amendments
        name: adr-amendments
        entry: python3 scripts/check_adr_amendments.py
        language: system
        pass_filenames: false
        # Pre-commit's staged-file list excludes deletions
        # (--diff-filter=ACMRTUXB), so a deletion-only commit can
        # match no file. always_run: true makes pre-commit run the
        # hook anyway; files: stays as scope documentation and is
        # harmless because pass_filenames: false means no filenames
        # are passed either way.
        always_run: true
        files: ^docs/decisions/.*\.md$
      - id: test-adr-amendments
        name: test-adr-amendments
        entry: python3 scripts/test_check_adr_amendments.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_adr_amendments|test_check_adr_amendments)\.py$
      - id: validator-spec-parity
        name: validator-spec-parity
        entry: python3 scripts/check_validator_spec_parity.py
        language: system
        pass_filenames: false
        files: ^(validator/internal/.+|validator/README\.md|docs/architecture/ProtoBotV2\.md|scripts/check_validator_spec_parity\.py)$
      - id: test-validator-spec-parity
        name: test-validator-spec-parity
        entry: python3 scripts/test_check_validator_spec_parity.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_validator_spec_parity|test_check_validator_spec_parity)\.py$
      - id: validator-fixtures
        name: validator-fixtures
        entry: python3 scripts/check_validator_fixtures.py
        language: system
        pass_filenames: false
        files: ^(validator/internal/.+_test\.go|scripts/check_validator_fixtures\.py)$
      - id: test-validator-fixtures
        name: test-validator-fixtures
        entry: python3 scripts/test_check_validator_fixtures.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_validator_fixtures|test_check_validator_fixtures)\.py$
      - id: spec-validator
        name: spec-validator
        entry: python3 scripts/check_spec_validator.py
        language: system
        pass_filenames: false
        # Pre-commit's staged-file list excludes deletions, and the
        # validator rejects deleted requirement records, so a
        # deletion-only commit must still run the hook. always_run: true
        # makes pre-commit run it anyway; files: stays as scope
        # documentation.
        always_run: true
        files: ^(spec/.+|tests/.+\.feature|validator/.+|scripts/(check_spec_validator|test_check_spec_validator|go_dependency_errors)\.py)$
      - id: test-spec-validator
        name: test-spec-validator
        entry: python3 scripts/test_check_spec_validator.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_spec_validator|test_check_spec_validator|go_dependency_errors)\.py$
      - id: test-select-comparison-base
        name: test-select-comparison-base
        entry: python3 scripts/test_select_comparison_base.py
        language: system
        pass_filenames: false
        files: ^(scripts/(select_comparison_base|test_select_comparison_base)\.py|\.github/workflows/ci-workflow\.yaml)$
      - id: test-git-base
        name: test-git-base
        entry: python3 scripts/test_git_base.py
        language: system
        pass_filenames: false
        files: ^scripts/(git_base|test_git_base|check_adr_amendments|test_check_adr_amendments|check_spec_validator|test_check_spec_validator|check_baseline_ratchet|test_check_baseline_ratchet)\.py$
