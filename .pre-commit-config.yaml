---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Enable the hooks for this repo
# > pip install --user --upgrade uv
# > uv tool install pre-commit
# > pre-commit install

# yamllint disable rule:line-length

# Completely exclude certain files from checks
# exclude: |
#   (?x)^(
#     vendor/.**|
#     dir2/.*
#   )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files  # Prevents giant files from being committed
      - id: check-docstring-first    # Prevent code before docstring
      - id: check-json               # Check that JSON files are valid
      - id: check-merge-conflict     # Check merge conflict strings
      - id: check-symlinks           # Ensure symlinks have a valid target
      - id: check-toml               # Ensure toml files are valid
      - id: check-xml                # Check that XML files are valid
      - id: debug-statements         # debugger imports and breakpoint() calls
      - id: end-of-file-fixer        # File is empty or ends with one newline
      - id: fix-byte-order-marker    # Forbid utf-8 byte order marker
      - id: trailing-whitespace      # Trims trailing whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
    hooks:
      # Forbid UTF-8 replacement character
      - id: text-unicode-replacement-char

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      # Lint yaml files
      - id: yamllint
        args: ["--strict", "-c", ".github/yamllint-config.yaml"]
        exclude: |
          (?x)^\.fullsend/config\.yaml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      # Note: lint/fix before format
      - id: ruff-check
      # args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: fecaddcd0b0601a3c02f729ae7a110511d2b52a6  # frozen: 0.12.20
    hooks:
      - id: uv-lock

  - repo: https://github.com/stbenjam/skillsaw
    rev: f39a95b028dba96c646a7dc2c3866cda0ab087f2  # frozen: v0.21.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".github/markdownlint-cli2.yaml"]
        exclude: |
          (?x)^(
                .github/pull_request_template\.md |
                .agents/skills/
            )$

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      # Lint Dockerfiles
      - id: hadolint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 4de1378e4cd853bfc2b111b05fff35e2dbf809a3  # frozen: v0.9.0.6
    hooks:
      - id: shellcheck

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0
    hooks:
      # Prevent secrets from being committed
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
                .fullsend/config\.yaml |
                \.skillsaw-baseline\.json |
                \.pre-commit-config\.yaml |
                \.protobot/change-sets/.*
            )$
      # YAML normalization quotes scalar values before line filters run.
      - id: detect-secrets
        name: detect-secrets-change-set-records
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-lines"
          - '^(base_commit|impact_assessment_base_commit): "[0-9a-fA-F]{40}"$'
        files: ^\.protobot/change-sets/

  - repo: https://gitlab.com/bmares/check-json5
    rev: 82381b1133603e4ff6eb3d866ec4501d121b669b  # frozen: v1.0.1
    hooks:
      # Check that JSON files are valid JSON5
      - id: check-json5

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: ["--config", ".zizmor.yml"]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: aeea3a1903dc2cccff77a888ec1135f5fac4c879  # frozen: 44.97.4
    hooks:
      - id: renovate-config-validator

  # Offline Go checks (gofmt, go vet) so sandboxed agents catch
  # formatting and vet errors without network hook repositories.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: python3 scripts/check_gofmt.py
        language: system
        files: \.go$
      - id: go-vet
        name: go-vet
        entry: python3 scripts/check_govet.py
        language: system
        files: \.go$
