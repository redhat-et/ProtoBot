# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
#
# The "runtime" key selects which agent runtime runs the agents, claude
# (default when unset) or pi. For one run, the 'fullsend run --runtime'
# flag wins, then FULLSEND_RUNTIME, then this file. See docs/runtimes.md.
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - redhat-et/ProtoBot
            - fullsend-ai/fullsend
            - fullsend-ai/agents
# Fullsend itself is pinned to sonnet 4.6. This changes what the `sonnet` alias means.
models:
    aliases:
        sonnet: claude-sonnet-5
agents:
    - name: code
      runtime: pi
      model: xai/grok-4.6
    - name: fix
      runtime: pi
      model: google-vertex/gemini-3.8-flash
    - name: prioritize
      runtime: pi
      model: google-vertex/gemini-3.8-flash
    - name: review
      runtime: pi
      model: sonnet
      source: harness/review.yaml
      subagents:
          challenger: xai/grok-4.6
          correctness: xai/grok-4.6
          docs-currency: google-vertex/gemini-3.8-flash
          intent-coherence: google-vertex/gemini-3.8-flash
          risk-assessment: google-vertex/gemini-3.8-flash
          security: xai/grok-4.6
          style-conventions: google-vertex/gemini-3.8-flash
    - name: retro
      model: sonnet
    - name: triage
      model: sonnet
      source: harness/triage.yaml
inference:
    project: it-gcp-octo-fullsend
    wif_provider: projects/554959098399/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-redhat-et-protobot
status_notifications:
    reaction:
        start: enabled
        completion: enabled
    comment:
        start: disabled
        completion: enabled
