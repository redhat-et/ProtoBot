---
base: "https://raw.githubusercontent.com/fullsend-ai/agents/v0.44.0/harness/review.yaml#sha256=92b871a3e74ce89c0299c5d34e151cfc5f94d91c127e6b6c006a2b4d1a5c96dd"

# Lock the review budget at the upstream default so spec-document PRs
# are not killed mid-synthesis. TIMEOUT_SECONDS must equal
# timeout_minutes * 60.
timeout_minutes: 45

env:
    sandbox:
        TIMEOUT_SECONDS: "2700"
        # Spec-document paths from AGENTS.md. Structured input for
        # cross-document consistency checks during review.
        # Must match the "Specification document hierarchy" list in
        # AGENTS.md 1:1. Enforced by the spec-hierarchy-sync hook.
        REVIEW_SPEC_HIERARCHY: "docs/vision.md,docs/architecture.md,docs/architecture/overview.md,docs/architecture/components.md,docs/architecture/git-integration.md,docs/architecture/validation-rules.md,docs/architecture/drafting-table-wms.md,docs/architecture/jobsite-sandbox.md,docs/architecture/user-interaction-flow.md,docs/architecture/drafting-table-ux.md,docs/architecture/agent-harness/,docs/architecture/related-work.md,docs/architecture/open-questions.md,docs/decisions/"
        # Restate the upstream default plus .fullsend/. env keys replace
        # wholesale under base: composition, so listing only the addition
        # would drop the default prefixes (harness/, .github/, ...).
        # .fullsend/ is a path prefix covering config.yaml and harness/.
        REVIEW_PROTECTED_PATHS: &review_protected_paths ".claude/,.cursor/,.pi/,.gitattributes,.github/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,profiles/,providers/,scripts/,skills/,.fullsend/"  # yamllint disable-line rule:line-length
    runner:
        REVIEW_PROTECTED_PATHS: *review_protected_paths
