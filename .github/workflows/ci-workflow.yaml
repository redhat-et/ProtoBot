---
# yamllint disable rule:line-length
name: CI Workflow

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pre-commit
        run: uv tool install pre-commit==4.6.2

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: pre-commit run -a

      - name: Run pre-commit gc
        run: pre-commit gc

  go:
    name: Go foundation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ears-manager/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l ears-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true
          working-directory: ears-manager

      - name: Run vet
        run: go vet ./...
        working-directory: ears-manager

      - name: Run tests
        run: go test ./...
        working-directory: ears-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      - name: Verify install target
        run: go install ./cmd/ears-manager
        working-directory: ears-manager

  scm:
    name: Source Control Manager checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source-control-manager/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l source-control-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true
          working-directory: source-control-manager

      - name: Run vet
        run: go vet ./...
        working-directory: source-control-manager

      - name: Run tests, the golden repository fixture included
        run: go test ./...
        working-directory: source-control-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o source-control-manager ./cmd/source-control-manager
        working-directory: source-control-manager

      - name: Verify install target
        run: go install ./cmd/source-control-manager
        working-directory: source-control-manager

  wms:
    name: WMS validation and in-memory adapter checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wms/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l wms)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true
          working-directory: wms

      - name: Run vet
        run: go vet ./...
        working-directory: wms

      - name: Run tests, the WMS golden fixture included
        run: go test ./...
        working-directory: wms

      - name: Build Go packages
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...
        working-directory: wms

  # This job provides a single status check for merge gates.
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - pre-commit
      - go
      - scm
      - wms
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more required jobs failed, were cancelled, or were skipped"
              exit 1
            fi
          done
          echo "All required jobs succeeded"
