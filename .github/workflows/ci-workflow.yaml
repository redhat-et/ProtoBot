---
# yamllint disable rule:line-length
name: CI Workflow

on:  # yamllint disable-line rule:truthy
  push:
    # Merge queue entries already run CI through the merge_group trigger.
    # Skip the ephemeral gh-readonly-queue/** refs so each enqueued commit
    # runs CI once (issue #312).
    branches-ignore: ["gh-readonly-queue/**"]
    tags: ["*"]
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # The pre-commit job now runs the Go hooks through scripts/lint.py
        # (.github/pre-commit-ci.yaml), so it needs the Go toolchain from
        # ADR-0005 Decision item 5.
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: validator/go.mod

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pre-commit
        # scripts/lint.py owns the required pre-commit version.
        run: |
          version="$(python3 scripts/lint.py --print-pre-commit-version)"
          uv tool install "pre-commit==${version}"

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        # Same entrypoint as local runs: --all-files keeps the previous
        # `pre-commit run -a` scope; --online-if-ci keeps zizmor's online
        # audits because GitHub Actions sets CI=true.
        run: python3 scripts/lint.py --all-files --online-if-ci

      - name: Run pre-commit gc
        # scripts/lint.py sets PRE_COMMIT_HOME only for its own process,
        # so this step still uses ~/.cache/pre-commit.
        run: pre-commit gc

  go:
    name: Go foundation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ears-manager/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l ears-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true
          working-directory: ears-manager

      - name: Run vet
        run: go vet ./...
        working-directory: ears-manager

      - name: Run tests
        run: go test ./...
        working-directory: ears-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      - name: Verify install target
        run: go install ./cmd/ears-manager
        working-directory: ears-manager

  spec:
    name: Specification store check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request, the default checkout is the synthetic merge
          # commit of the PR head into the default-branch tip; the merge
          # base of that commit with the default branch is the tip itself,
          # so the artifact delta must run on the PR head, whose merge base
          # is the fork point. On push, merge_group, and workflow_dispatch,
          # the expression falls back to github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ears-manager/go.mod

      - name: Build ears-manager
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      # Create local refs/heads/main so check can tell approved from proposed
      # change sets (docs/architecture/git-integration.md#gates-and-labels).
      - name: Fetch default branch for change-set approval
        run: |
          # This remote and branch are pinned to the committed self-hosting
          # configuration; the self-hosting test checks that coupling.
          git fetch --no-tags https://github.com/redhat-et/ProtoBot.git refs/heads/main
          git checkout --detach HEAD
          git update-ref refs/heads/main FETCH_HEAD

      # The artifact-operation delta must not blame this PR for registered
      # artifact changes that the default branch made after this PR forked,
      # so its baseline is the merge base of the default branch and HEAD.
      # Change-set approval and proposed-base freshness still compare with
      # the default-branch tip above; --base-ref narrows only the artifact
      # delta.
      - name: Compute artifact comparison base
        id: artifact-base
        run: |
          if ! base=$(git merge-base refs/heads/main HEAD) || [ -z "$base" ]; then
            echo "::error::Could not compute the merge base of refs/heads/main and HEAD for the artifact comparison"
            exit 1
          fi
          printf 'commit=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Verify change-set store location
        id: change-set-store
        run: |
          store_path() {
            awk '
              /^stores:$/ { in_stores = 1; next }
              in_stores && /^[^[:space:]]/ { exit }
              in_stores && /^    change_sets: / {
                sub(/^    change_sets: /, "")
                print
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            '
          }

          if [ ! -f .protobot/project.yaml ]; then
            echo "::error::The checked-out revision has no initialized .protobot project"
            exit 1
          fi
          if git cat-file -e refs/heads/main:.protobot/project.yaml 2>/dev/null; then
            if ! main_store=$(git show refs/heads/main:.protobot/project.yaml | store_path); then
              echo "::error::Could not read stores.change_sets from the default branch project configuration"
              exit 1
            fi
          else
            # The initial self-hosting PR establishes this default.
            main_store=.protobot/change-sets
          fi
          if ! current_store=$(store_path < .protobot/project.yaml); then
            echo "::error::Could not read stores.change_sets from the checked-out project configuration"
            exit 1
          fi
          if [ "$current_store" != "$main_store" ]; then
            echo "::error::The change-set store path cannot change in the same check that enforces its integrity"
            exit 1
          fi
          printf 'path=%s\n' "$current_store" >> "$GITHUB_OUTPUT"

      # Approved manifests are immutable. New manifests are allowed; only
      # modifications, deletions, or type changes to paths on main fail.
      - name: Verify approved change-set manifests are unchanged
        env:
          CHANGE_SET_STORE: ${{ steps.change-set-store.outputs.path }}
        run: |
          if git diff --quiet --no-renames --diff-filter=MDT refs/heads/main...HEAD -- "$CHANGE_SET_STORE/"; then
            exit 0
          else
            diff_status=$?
          fi
          if [ "$diff_status" -ne 1 ]; then
            echo "::error::Could not compare approved change-set manifests (git diff exited $diff_status)"
            exit "$diff_status"
          fi
          echo "::error::An approved change-set manifest was modified, deleted, or replaced"
          git diff --name-status --no-renames --diff-filter=MDT refs/heads/main...HEAD -- "$CHANGE_SET_STORE/"
          exit 1

      - name: Run ears-manager check
        env:
          ARTIFACT_BASE: ${{ steps.artifact-base.outputs.commit }}
        run: ./ears-manager/ears-manager --output json check --base-ref "$ARTIFACT_BASE"

  validator:
    name: V2 specification validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the comparison base resolves locally.
          fetch-depth: 0

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: validator/go.mod
          cache-dependency-path: validator/go.sum

      # scripts/check_spec_validator.py builds with module downloads
      # disabled, so warm the module cache first.
      - name: Download validator module dependencies
        run: go mod download
        working-directory: validator
        env:
          GOWORK: "off"

      - name: Check formatting
        run: |
          files="$(gofmt -l validator)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true
          working-directory: validator

      - name: Run vet
        run: go vet ./...
        working-directory: validator

      - name: Run validator module tests
        run: go test ./...
        working-directory: validator
        env:
          GOWORK: "off"

      # Requirement text is only approved once it reaches the default branch.
      # A pull request or merge group run compares the candidate with the base
      # branch. A push to the default branch compares with the exact previous
      # tip, so edits to approved text fail even after a history rewrite; a
      # push to any other branch compares with the approved default branch, so
      # revising unapproved text on the branch is allowed. A base that the
      # event requires but git cannot provide fails the step
      # (scripts/select_comparison_base.py).
      - name: Select the comparison base
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/select_comparison_base.py

      - name: Run the V2 specification validator
        env:
          GITHUB_BASE_SHA: ${{ steps.base.outputs.merge_base }}
          PROTOBOT_VALIDATOR_BASE: ${{ steps.base.outputs.exact_base }}
        run: python3 scripts/check_spec_validator.py

  scm:
    name: Source Control Manager checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source-control-manager/go.mod

      - name: Build ears-manager for the real-binary replay
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      - name: Check formatting
        run: |
          files="$(gofmt -l source-control-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true
          working-directory: source-control-manager

      - name: Run vet
        run: go vet ./...
        working-directory: source-control-manager

      - name: Run tests, the golden repository fixture included
        run: go test ./...
        working-directory: source-control-manager

      - name: Replay the golden repository fixture against real ears-manager
        run: go test -count=1 -v ./internal/golden
        working-directory: source-control-manager
        env:
          SCM_FIXTURE_EARS_MANAGER: ${{ github.workspace }}/ears-manager/ears-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o source-control-manager ./cmd/source-control-manager
        working-directory: source-control-manager

      - name: Verify install target
        run: go install ./cmd/source-control-manager
        working-directory: source-control-manager

  wms:
    name: WMS validation and in-memory adapter checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wms/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l wms)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true
          working-directory: wms

      - name: Run vet
        run: go vet ./...
        working-directory: wms

      - name: Run tests, the WMS golden fixture included
        run: go test ./...
        working-directory: wms

      - name: Build Go packages
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...
        working-directory: wms

  # ADR-0005 Decision item 3: prove the gate invariant on the exact
  # pre-commit version the Fullsend sandbox runs. The matrix covers
  # both images item 3 names: ubuntu-24.04, the Fullsend runner_image,
  # and ubuntu-latest, with the same probes. The job reads only the
  # checked-out tree and never reads .github/pre-commit-ci.yaml, so a
  # branch that predates the cutover still passes.
  gate-rehearsal:
    name: Gate rehearsal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the pre-commit version Fullsend ships
        # scripts/pre_commit_cache.py owns the Fullsend pin;
        # scripts/lint.py owns the separate CI and developer pin.
        run: |
          version="$(python3 scripts/pre_commit_cache.py --print-pre-commit-version)"
          python3 -m venv "$RUNNER_TEMP/gate-venv"
          "$RUNNER_TEMP/gate-venv/bin/pip" install "pre-commit==${version}"

      - name: Check the gate invariant
        # The venv has PyYAML because pre-commit depends on it. Every
        # gate checker must have a companion test hook, so the gate
        # run below exercises its negative fixture and expected
        # diagnostic.
        run: |
          "$RUNNER_TEMP/gate-venv/bin/python3" scripts/check_gate_invariant.py

      # Exactly one step invokes `pre-commit run` directly, as the
      # Fullsend gate does; every other lint entrypoint stays
      # scripts/lint.py.
      - name: Rehearse the gate
        run: |
          set -euo pipefail

          venv="$RUNNER_TEMP/gate-venv"
          bin="$RUNNER_TEMP/gate-bin"
          home="$RUNNER_TEMP/gate-home"
          gate_user_home="$RUNNER_TEMP/gate-user-home"
          log_job_env="$RUNNER_TEMP/gate-run-job-env.log"
          log_env_i="$RUNNER_TEMP/gate-run-env-i.log"

          # Deny VCS access for the whole step: only the file protocol
          # stays allowed, and git must never prompt for credentials.
          # PyPI stays reachable: the gate `language: python` hooks
          # install their declared dependencies from PyPI, so no pip
          # index, proxy, or offline variable is set here.
          export GIT_ALLOW_PROTOCOL=file
          export GIT_TERMINAL_PROMPT=0

          # A minimal PATH with only git, the venv python3, and the
          # venv pre-commit, so go, gofmt, node, npm, and uvx do not
          # resolve.
          mkdir -p "$bin"
          ln -s "$(command -v git)" "$bin/git"
          ln -s "$venv/bin/python3" "$bin/python3"
          ln -s "$venv/bin/pre-commit" "$bin/pre-commit"

          # pip and pre-commit resolve user paths from HOME; an unset
          # HOME is not a stable gate condition. Both runs get this
          # dedicated user home and the C.UTF-8 locale explicitly.
          mkdir -p "$gate_user_home"

          # Remove the default-branch refs once, before the first
          # probes, so the probes can confirm their absence. A ref
          # that is absent is already in the wanted state. These
          # deletions are the only change to the repository tree.
          git checkout --detach
          for ref in refs/heads/main refs/remotes/origin/main; do
            if git show-ref --verify --quiet "$ref"; then
              git update-ref -d "$ref"
            fi
          done

          verify_gate_environment() {
            if git ls-remote https://github.com/redhat-et/ProtoBot.git \
              refs/heads/main >/dev/null 2>&1; then
              echo "::error::git ls-remote against github.com succeeded; VCS access is not denied"
              exit 1
            fi
            if git rev-parse --verify refs/heads/main >/dev/null 2>&1; then
              echo "::error::refs/heads/main resolves; a default-branch ref is visible"
              exit 1
            fi
            if git rev-parse --verify refs/remotes/origin/main >/dev/null 2>&1; then
              echo "::error::refs/remotes/origin/main resolves; a default-branch ref is visible"
              exit 1
            fi
            for tool in go gofmt node npm uvx; do
              if (PATH="$bin"; command -v "$tool" >/dev/null 2>&1); then
                echo "::error::${tool} resolves on the minimal PATH; the gate must not need it"
                exit 1
              fi
            done
          }

          require_empty_home() {
            local home_dir="$1"
            if [ -z "$(ls -A "$home_dir")" ]; then
              return 0
            fi
            echo "::error::PRE_COMMIT_HOME is not empty before the run: $home_dir"
            exit 1
          }

          fail_on_skip() {
            local log="$1"
            if grep -Eq 'Skipped$|skipped=|skipped ' "$log"; then
              echo "::error::A hook or test was skipped; see $log"
              grep -E 'Skipped$|skipped=|skipped ' "$log" || true
              exit 1
            fi
          }

          # pre-commit prints a passing hook's output only with
          # --verbose, so an `OK (skipped=N)` unittest summary reaches
          # fail_on_skip; --color=never keeps the saved log free of
          # ANSI escapes.
          # ── Direct run 1: the job environment ─────────────────────
          rm -rf "$home"
          mkdir -p "$home"
          verify_gate_environment
          require_empty_home "$home"
          env PATH="$bin" PRE_COMMIT_HOME="$home" HOME="$gate_user_home" \
            LANG=C.UTF-8 GIT_ALLOW_PROTOCOL=file GIT_TERMINAL_PROMPT=0 \
            pre-commit run --all-files --verbose --color=never 2>&1 | tee "$log_job_env"
          fail_on_skip "$log_job_env"

          # ── Direct run 2: env -i, to catch hooks that read
          # environment variables ───────────────────────────────────
          rm -rf "$home"
          mkdir -p "$home"
          verify_gate_environment
          require_empty_home "$home"
          env -i PATH="$bin" PRE_COMMIT_HOME="$home" HOME="$gate_user_home" \
            LANG=C.UTF-8 GIT_ALLOW_PROTOCOL=file GIT_TERMINAL_PROMPT=0 \
            pre-commit run --all-files --verbose --color=never 2>&1 | tee "$log_env_i"
          fail_on_skip "$log_env_i"

  # This job provides a single status check for merge gates.
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - pre-commit
      - go
      - spec
      - validator
      - scm
      - wms
      - gate-rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more required jobs failed, were cancelled, or were skipped"
              exit 1
            fi
          done
          echo "All required jobs succeeded"
