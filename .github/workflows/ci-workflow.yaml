---
# yamllint disable rule:line-length
name: CI Workflow

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pre-commit
        run: uv tool install pre-commit==4.6.2

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: pre-commit run -a

      - name: Run pre-commit gc
        run: pre-commit gc

  go:
    name: Go foundation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ears-manager/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l ears-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
          skip-cache: true
          working-directory: ears-manager

      - name: Run vet
        run: go vet ./...
        working-directory: ears-manager

      - name: Run tests
        run: go test ./...
        working-directory: ears-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      - name: Verify install target
        run: go install ./cmd/ears-manager
        working-directory: ears-manager

  spec:
    name: Specification store check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ears-manager/go.mod

      - name: Build ears-manager
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      # Create local refs/heads/main so check can tell approved from proposed
      # change sets (docs/architecture/git-integration.md#gates-and-labels).
      - name: Fetch default branch for change-set approval
        run: |
          # This remote and branch are pinned to the committed self-hosting
          # configuration; the self-hosting test checks that coupling.
          git fetch --no-tags https://github.com/redhat-et/ProtoBot.git refs/heads/main
          git checkout --detach HEAD
          git update-ref refs/heads/main FETCH_HEAD

      - name: Verify change-set store location
        id: change-set-store
        run: |
          store_path() {
            awk '
              /^stores:$/ { in_stores = 1; next }
              in_stores && /^[^[:space:]]/ { exit }
              in_stores && /^    change_sets: / {
                sub(/^    change_sets: /, "")
                print
                found = 1
                exit
              }
              END { if (!found) exit 1 }
            '
          }

          if [ ! -f .protobot/project.yaml ]; then
            echo "::error::The checked-out revision has no initialized .protobot project"
            exit 1
          fi
          if git cat-file -e refs/heads/main:.protobot/project.yaml 2>/dev/null; then
            if ! main_store=$(git show refs/heads/main:.protobot/project.yaml | store_path); then
              echo "::error::Could not read stores.change_sets from the default branch project configuration"
              exit 1
            fi
          else
            # The initial self-hosting PR establishes this default.
            main_store=.protobot/change-sets
          fi
          if ! current_store=$(store_path < .protobot/project.yaml); then
            echo "::error::Could not read stores.change_sets from the checked-out project configuration"
            exit 1
          fi
          if [ "$current_store" != "$main_store" ]; then
            echo "::error::The change-set store path cannot change in the same check that enforces its integrity"
            exit 1
          fi
          printf 'path=%s\n' "$current_store" >> "$GITHUB_OUTPUT"

      # Approved manifests are immutable. New manifests are allowed; only
      # modifications, deletions, or type changes to paths on main fail.
      - name: Verify approved change-set manifests are unchanged
        env:
          CHANGE_SET_STORE: ${{ steps.change-set-store.outputs.path }}
        run: |
          if git diff --quiet --no-renames --diff-filter=MDT refs/heads/main...HEAD -- "$CHANGE_SET_STORE/"; then
            exit 0
          else
            diff_status=$?
          fi
          if [ "$diff_status" -ne 1 ]; then
            echo "::error::Could not compare approved change-set manifests (git diff exited $diff_status)"
            exit "$diff_status"
          fi
          echo "::error::An approved change-set manifest was modified, deleted, or replaced"
          git diff --name-status --no-renames --diff-filter=MDT refs/heads/main...HEAD -- "$CHANGE_SET_STORE/"
          exit 1

      - name: Run ears-manager check
        run: ./ears-manager/ears-manager --output json check

  scm:
    name: Source Control Manager checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source-control-manager/go.mod

      - name: Build ears-manager for the real-binary replay
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ears-manager ./cmd/ears-manager
        working-directory: ears-manager

      - name: Check formatting
        run: |
          files="$(gofmt -l source-control-manager)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
          skip-cache: true
          working-directory: source-control-manager

      - name: Run vet
        run: go vet ./...
        working-directory: source-control-manager

      - name: Run tests, the golden repository fixture included
        run: go test ./...
        working-directory: source-control-manager

      - name: Replay the golden repository fixture against real ears-manager
        run: go test -count=1 -v ./internal/golden
        working-directory: source-control-manager
        env:
          SCM_FIXTURE_EARS_MANAGER: ${{ github.workspace }}/ears-manager/ears-manager

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o source-control-manager ./cmd/source-control-manager
        working-directory: source-control-manager

      - name: Verify install target
        run: go install ./cmd/source-control-manager
        working-directory: source-control-manager

  wms:
    name: WMS validation and in-memory adapter checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wms/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l wms)" || exit $?
          test -z "$files"

      - name: Run golangci-lint
        # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
          skip-cache: true
          working-directory: wms

      - name: Run vet
        run: go vet ./...
        working-directory: wms

      - name: Run tests, the WMS golden fixture included
        run: go test ./...
        working-directory: wms

      - name: Build Go packages
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...
        working-directory: wms

  drafting-table:
    name: Drafting Table guard and replay
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: drafting-table/go.mod

      - name: Check formatting
        run: |
          files="$(gofmt -l drafting-table)" || exit $?
          test -z "$files"

      - name: Run vet
        run: go vet ./...
        working-directory: drafting-table

      - name: Run tests, the guard vectors included
        run: go test ./...
        working-directory: drafting-table

      - name: Cache the pinned OpenCode binary
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opencode-fixture
          key: opencode-1.18.30-linux-x64

      # The binary is never executed until its digest matches: the cached
      # file is digest-checked before use, the tarball digest is verified
      # on download, and the extracted binary digest is re-verified before
      # the version check runs.
      - name: Install the pinned OpenCode 1.18.30 binary
        run: |
          set -eu
          dest="$HOME/.cache/opencode-fixture"
          binary_digest="87bd160e053af86b5b409daabf71f8dc05bbc3a2a3a5f563f36011cdf706a999"
          mkdir -p "$dest"
          if [ ! -x "$dest/opencode" ] || ! echo "$binary_digest  $dest/opencode" | sha256sum -c --quiet; then
            curl -fsSL -o "$RUNNER_TEMP/opencode.tar.gz" \
              "https://github.com/sst/opencode/releases/download/v1.18.30/opencode-linux-x64.tar.gz"
            echo "55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17  $RUNNER_TEMP/opencode.tar.gz" | sha256sum -c -
            rm -rf "$dest"
            mkdir -p "$dest"
            tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$dest"
            echo "$binary_digest  $dest/opencode" | sha256sum -c -
          fi
          test "$("$dest/opencode" --version)" = "1.18.30"

      - name: Replay the deterministic Drafting Table fixture
        run: |
          OPENCODE_BIN="$HOME/.cache/opencode-fixture/opencode" \
          PYTHONDONTWRITEBYTECODE=1 \
          python3 -m unittest discover -s tests/drafting-table -p 'test_*.py' -v

  # This job provides a single status check for merge gates.
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - pre-commit
      - go
      - spec
      - scm
      - wms
      - drafting-table
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more required jobs failed, were cancelled, or were skipped"
              exit 1
            fi
          done
          echo "All required jobs succeeded"
