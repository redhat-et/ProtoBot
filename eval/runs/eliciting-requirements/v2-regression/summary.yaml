    review_discipline:
      judge_type: llm
      rationale: 'The output excels across all evaluation criteria:


        **Uncertainty preservation (required finding 1):** The source''s "probably"
        and "may" are explicitly preserved as unresolved uncertainty. The Rationale
        and Context section directly states: "The source statement ''the report probably
        should show a warning'' uses modal language (''probably,'' ''should'') that
        signals deliberation, not an obligation. This has been treated as a goal in
        need of clarification, not a normative `shall` obligation." No "probably"
        was converted into "shall" without confirmation.


        **Asking whether warning is normative and defining staleness (required finding
        2):** Q1 asks for the staleness threshold/measure, Q2 explicitly asks whether
        the warning is mandatory (normative) or optional. Both are marked as blocking
        questions.


        **Report boundary and warning observation (required finding 3):** The system
        boundary is identified as "the report surface (UI, document, or API response)."
        The warning observation is addressed in the verification contract''s "Observable
        evidence or oracle" field and in SR-C (operational companion about exposing
        the data-age value for verifiability).


        **Disallowed behaviors:** No "probably" was converted to "shall" without confirmation
        — the candidate uses "shall" only in a provisional sketch explicitly labeled
        "not normative." No stale age or warning channel was chosen. The candidate
        is not marked ready — it''s `needs clarification`.


        **Structural separation:** All required sections are present with correct
        headings: Understanding, Clarifying Questions, Candidate Requirements (with
        Status, Template, Requirement, Source intent, Implementability contract with
        all fields, Verification contract with all fields), Suggested Supporting Requirements,
        Consistency Findings, Assumptions, Rationale and Context, Review Status. Goals,
        rationale, assumptions, design ideas, and obligations are kept in separate
        buckets. Suggestions (SR-A, SR-B, SR-C) are outside the candidate list.


        **Contracts:** Both implementability and verification contracts are filled
        out with explicit "Open" markers for unresolved items, properly cross-referencing
        the clarifying questions.


        **Review Status:** Clear table showing all items at `needs clarification`
        or `suggestion` status with blocking reasons.


        The only very minor observation is that the provisional sketch uses "shall"
        even though labeled non-normative, but this is explicitly flagged and clearly
        separated. The output is thorough, well-structured, and faithfully preserves
        all uncertainty from the source.'
